packages:
  - '.'
  - 'documentation'

# Companion library; betas often publish <24h before CI runs. pnpm 11 defaults
# minimumReleaseAge to 1440 minutes for supply-chain verification.
minimumReleaseAgeExclude:
  - parallax-controller

overrides:
  lodash: 4.18.1
  webpack: 5.97.1

# pnpm v11+ (strictDepBuilds): list every dep with lifecycle scripts as true
# (run) or false (skip). core-js postinstall is optional for this repo.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
