packages:
  - '.'
  - 'documentation'

# pnpm v11+ (strictDepBuilds): list every dep with lifecycle scripts as true
# (run) or false (skip). core-js postinstall is optional for this repo.
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  esbuild: true

# Companion library; betas often publish <24h before CI runs. pnpm 11 defaults
# minimumReleaseAge to 1440 minutes for supply-chain verification.
minimumReleaseAgeExclude:
  - parallax-controller

overrides:
  lodash: 4.18.1
  serialize-javascript@<=7.0.2: '>=7.0.3'
  serialize-javascript@>=5.0.0 <7.0.5: '>=7.0.5'
  uuid@<11.1.1: '>=11.1.1'
  webpack: 5.97.1
  webpack@>=5.49.0 <5.104.0: '>=5.104.0'
  webpack@>=5.49.0 <=5.104.0: '>=5.104.1'
